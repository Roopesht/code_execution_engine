services:
  code-executor:
    build: .
    container_name: code-executor
    ports:
      - "7998:7998"
    volumes:
      - ./certs/server-cert.pem:/app/certs/cert.pem:ro
      - ./certs/server-key.pem:/app/certs/key.pem:ro
    environment:
      - EXECUTOR_API_KEY=${EXECUTOR_API_KEY:-dev_key_12345678901234567890CHANGE_IN_PROD}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3006,http://localhost:8000,https://localhost:3000,https://localhost:8000,https://tests.ojasamirai.com}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - EXECUTION_TIMEOUT=${EXECUTION_TIMEOUT:-5}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-7999}
      - HTTPS_PORT=${HTTPS_PORT:-7998}
      # LLM Service Configuration (Story 6.4)
      - LLM_SERVICE_URL=${LLM_SERVICE_URL:-http://host.docker.internal:8001}
      - LLM_SERVICE_TIMEOUT=${LLM_SERVICE_TIMEOUT:-30}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-coder-0.5b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-150}
      - LLM_TOP_P=${LLM_TOP_P:-0.9}
    restart: unless-stopped
