services:
  code-executor:
    build: .
    container_name: code-executor
    ports:
      - "7999:7999"
    environment:
      - EXECUTOR_API_KEY=${EXECUTOR_API_KEY:-dev_key_12345678901234567890CHANGE_IN_PROD}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - EXECUTION_TIMEOUT=${EXECUTION_TIMEOUT:-5}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-7999}
    restart: unless-stopped
