version: '3.8'

services:
  llm-server:
    build:
      context: ../..
      dockerfile: lms/docker/Dockerfile
    container_name: llm-server
    image: llm-server:latest
    ports:
      - "8001:8001"
    # Mount volumes for logs, cache, and optional external models
    volumes:
      - ../models:/models
      - ./llm_logs:/logs
      - ./llm_cache:/cache
    environment:
      - MODEL_PATH=/models/active.gguf
      - CONFIG_PATH=/app/runtime.json
      - CACHE_PATH=/cache
      - LOG_PATH=/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 6G
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
